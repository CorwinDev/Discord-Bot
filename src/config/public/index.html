<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Tình hình bot</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #161a1d;
      --panel: #1e2428;
      --line: #2e373d;
      --text: #e7eaec;
      --muted: #94a0a8;
      --ok: #4ade80;
      --warn: #f5b942;
      --bad: #ff6b6b;
      --info: #7aa2ff;
      --state: var(--muted);
    }
    body[data-status="online"]       { --state: var(--ok); }
    body[data-status="degraded"],
    body[data-status="reconnecting"],
    body[data-status="starting"]     { --state: var(--warn); }
    body[data-status="offline"]      { --state: var(--bad); }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 880px; margin: 0 auto; padding: 32px 16px 56px; }
    .num { font-variant-numeric: tabular-nums; }

    
    header h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 44px);
      line-height: 1.15;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .who { margin: 6px 0 0; color: var(--muted); }
    .state { display: flex; align-items: center; gap: 10px; margin-top: 18px; font-size: 18px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--state); flex: none; }
    body[data-status="online"] .dot { box-shadow: 0 0 0 0 var(--state); animation: pulse 2.4s ease-out infinite; }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(74, 222, 128, .55); }
      70%  { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
      100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
    }
    @media (prefers-reduced-motion: reduce) { body[data-status="online"] .dot { animation: none; } }

    
    .trace { margin: 20px 0 8px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .trace svg { display: block; width: 100%; height: 96px; }
    .trace path { fill: none; stroke: var(--state); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .trace .base { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 5; }
    .trace-note { margin: 0; color: var(--muted); font-size: 14px; }

    
    dl.stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      margin: 28px 0 0;
      border-top: 1px solid var(--line);
    }
    dl.stats div { padding: 14px 16px 14px 0; border-bottom: 1px solid var(--line); }
    dl.stats dt { color: var(--muted); font-size: 14px; }
    dl.stats dd { margin: 2px 0 0; font-size: 24px; font-weight: 600; }
    dl.stats dd small { font-size: 14px; font-weight: 400; color: var(--muted); }

    h2 { margin: 36px 0 12px; font-size: 18px; font-weight: 600; }
    .cols { display: grid; gap: 0 40px; grid-template-columns: 1fr; }
    @media (min-width: 760px) { .cols { grid-template-columns: 1fr 1.6fr; } }

    ul.plain { list-style: none; margin: 0; padding: 0; }
    .shards li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .shards .muted, .empty { color: var(--muted); }

    .incidents li { padding: 10px 0 10px 14px; border-bottom: 1px solid var(--line); border-left: 3px solid var(--line); margin-bottom: 0; }
    .incidents li[data-level="error"]     { border-left-color: var(--bad); }
    .incidents li[data-level="warn"]      { border-left-color: var(--warn); }
    .incidents li[data-level="recovered"] { border-left-color: var(--ok); }
    .incidents li[data-level="info"]      { border-left-color: var(--info); }
    .incidents time { display: block; color: var(--muted); font-size: 13px; }
    .incidents p { margin: 2px 0 0; overflow-wrap: anywhere; }

    
    form#login { margin-top: 28px; max-width: 360px; }
    form#login[hidden] { display: none; }
    form#login label { display: block; margin-bottom: 6px; }
    form#login .row { display: flex; gap: 8px; }
    input, button { font: inherit; color: inherit; }
    input { flex: 1; min-width: 0; padding: 9px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
    button { padding: 9px 16px; background: var(--text); color: var(--bg); border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--info); outline-offset: 2px; }
    #loginError { color: var(--bad); margin: 8px 0 0; min-height: 1.5em; }

    footer { margin-top: 40px; color: var(--muted); font-size: 14px; }
    #content[hidden] { display: none; }
  </style>
</head>
<body data-status="starting">
  <main>
    <header>
      <h1 id="botName">Bot Discord</h1>
      <p class="who" id="botSub">Đang tải trạng thái…</p>
      <div class="state" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">Đang tải</span>
      </div>
    </header>

    <form id="login" hidden>
      <label for="token">Trang này cần mật khẩu để xem</label>
      <div class="row">
        <input id="token" type="password" autocomplete="current-password" required>
        <button type="submit">Xem tình hình</button>
      </div>
      <p id="loginError" role="alert"></p>
    </form>

    <div id="content" hidden>
      <div class="trace">
        <svg id="traceSvg" viewBox="0 0 600 96" preserveAspectRatio="none" role="img" aria-label="Biểu đồ ping gần đây">
          <line class="base" x1="0" y1="48" x2="600" y2="48"></line>
          <path id="tracePath" d=""></path>
        </svg>
      </div>
      <p class="trace-note" id="traceNote">Ping được ghi lại mỗi 5 giây khi bạn mở trang này.</p>

      <dl class="stats">
        <div><dt>Ping</dt><dd class="num" id="sPing">–</dd></div>
        <div><dt>Bot chạy được</dt><dd class="num" id="sUptime">–</dd></div>
        <div><dt>Kết nối liên tục</dt><dd class="num" id="sConnected">–</dd></div>
        <div><dt>Server</dt><dd class="num" id="sGuilds">–</dd></div>
        <div><dt>Thành viên</dt><dd class="num" id="sMembers">–</dd></div>
        <div><dt>Lệnh</dt><dd class="num" id="sCommands">–</dd></div>
        <div><dt>RAM</dt><dd class="num" id="sMem">–</dd></div>
        <div><dt>Đã tự khắc phục</dt><dd class="num" id="sRecoveries">–</dd></div>
      </dl>

      <div class="cols">
        <section>
          <h2>Kết nối</h2>
          <ul class="plain shards" id="shards"></ul>
          <ul class="plain shards" id="system"></ul>
        </section>
        <section>
          <h2>Sự cố gần đây</h2>
          <ul class="plain incidents" id="incidents"></ul>
        </section>
      </div>
    </div>

    <footer id="updated"></footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
